<div class="sv-container py-5 d-flex justify-content-center">
  <div class="card border rounded-3 p-4 p-md-5 bg-white shadow-sm" style="max-width: 480px; width: 100%;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 mb-2">
        <img src="shopvibe-logo.svg" alt="ShopVibe" width="36" height="36">
        <span class="fs-4 fw-bold text-dark"><span class="text-danger">Shop</span>Vibe</span>
      </div>
      <h1 class="h4 fw-bold mb-1">Create Your Account</h1>
      <p class="text-muted small">Join thousands of Egyptian tech professionals on ShopVibe</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Full Name *</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-regular fa-user text-muted"></i></span>
          <input
            type="text"
            class="form-control"
            placeholder="Mohamed Ahmed"
            [(ngModel)]="user.name"
            name="name"
            required
            minlength="3"
          />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Email Address *</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
          <input
            type="email"
            class="form-control"
            placeholder="name@example.com"
            [(ngModel)]="user.email"
            name="email"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold">Password *</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
          <input
            type="password"
            class="form-control"
            placeholder="Minimum 6 characters"
            [(ngModel)]="user.password"
            name="password"
            required
            minlength="6"
          />
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold">Governorate / City</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-location-dot text-muted"></i></span>
          <input
            type="text"
            class="form-control"
            placeholder="e.g. Cairo, Giza, Alexandria"
            [(ngModel)]="user.address"
            name="address"
          />
        </div>
      </div>

      <button type="submit" class="btn sv-btn-primary w-100 py-2 fw-semibold mb-3">
        Create ShopVibe Account
      </button>

      <div class="text-muted small text-center">
        By creating an account, you agree to ShopVibe's Terms and receive occasional tech deal alerts.
      </div>
    </form>

    <div class="text-center text-muted small mt-4 pt-3 border-top">
      Already have an account?
      <a routerLink="/login" class="text-danger fw-semibold text-decoration-none ms-1">Sign In</a>
    </div>
  </div>
</div>
