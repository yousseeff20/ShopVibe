<div class="sv-container py-5 d-flex justify-content-center">
  <div class="card border rounded-3 p-4 p-md-5 bg-white shadow-sm" style="max-width: 440px; width: 100%;">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center gap-2 mb-2">
        <img src="shopvibe-logo.svg" alt="ShopVibe" width="36" height="36">
        <span class="fs-4 fw-bold text-dark"><span class="text-danger">Shop</span>Vibe</span>
      </div>
      <h1 class="h4 fw-bold mb-1">Welcome Back</h1>
      <p class="text-muted small">Sign in to track orders and manage your saved tech gear</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
          <input
            type="email"
            class="form-control"
            placeholder="name@example.com"
            [(ngModel)]="email"
            name="email"
            required
          />
        </div>
      </div>

      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center">
          <label class="form-label small fw-semibold mb-0">Password</label>
          <a routerLink="/login" class="small text-danger text-decoration-none">Forgot password?</a>
        </div>
        <div class="input-group mt-1">
          <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
          <input
            type="password"
            class="form-control"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn sv-btn-primary w-100 py-2 fw-semibold mb-3">
        Sign In to Account
      </button>

      <button type="button" class="btn btn-outline-dark w-100 py-2 small fw-semibold mb-3" (click)="fillDemo()">
        <i class="fa-solid fa-bolt text-warning me-2"></i> Quick Demo Login
      </button>
    </form>

    <div class="text-center text-muted small mt-2">
      Don't have a ShopVibe account yet?
      <a routerLink="/signup" class="text-danger fw-semibold text-decoration-none ms-1">Create Account</a>
    </div>
  </div>
</div>
